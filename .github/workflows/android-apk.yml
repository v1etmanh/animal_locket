name: Build Android APK

on:
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - master
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK with demo server config
        working-directory: mobile
        run: flutter build apk --debug --android-skip-build-dependency-validation --dart-define-from-file=env/demo-server.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animal-locket-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
