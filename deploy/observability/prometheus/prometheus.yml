global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ---- Các service Spring Boot (Micrometer) ----
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api-gateway:8080"] }]
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["user-service:8101"] }]
  - job_name: post-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["post-service:8102"] }]
  - job_name: media-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["media-service:8103"] }]
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["discovery-service:8104"] }]
  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["chat-service:8105"] }]
  - job_name: billing-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["billing-service:8106"] }]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["notification-service:8107"] }]
  # Config server và Eureka không bật prometheus (chỉ health,info) nên không scrape; giám sát qua Docker healthcheck.

  # ---- Hạ tầng ----
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8080"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio:9000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
