# Dev: không khai báo chứng chỉ => Traefik tự sinh chứng chỉ mặc định (tự ký) cho cổng 443. Trình duyệt sẽ cảnh báo, điện thoại
# thường từ chối; dev trên điện thoại hãy dùng HTTP (cổng 80) hoặc tạo chứng chỉ tin cậy bằng mkcert rồi bỏ comment bên dưới.
#
# tls:
#   certificates:
#     - certFile: /certs/dev.pem
#       keyFile: /certs/dev-key.pem
#   stores:
#     default:
#       defaultCertificate:
#         certFile: /certs/dev.pem
#         keyFile: /certs/dev-key.pem

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
