server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  security:
    user:
      name: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config-dev-password}
  cloud:
    config:
      server:
        native:
          # Dev: đọc thư mục cục bộ. Production: đổi sang profile git trỏ vào repo cấu hình
          # (chỉ chứa cấu hình KHÔNG nhạy cảm; bí mật đi bằng biến môi trường/Vault).
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
