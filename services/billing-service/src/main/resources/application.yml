server:
  port: 8106

spring:
  application:
    name: billing-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config-dev-password}
      fail-fast: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing_db}
    username: ${DB_USER:animal}
    password: ${DB_PASSWORD:animal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/animal-locket/protocol/openid-connect/certs}

animal:
  security:
    enabled: true
    # Webhook của store không có JWT của người dùng; WebhookController tự xác thực chữ ký/token của store.
    public-paths: /webhooks/**
  billing:
    expiry-grace: 1h
    # CHỈ bật khi phát triển. Không bao giờ bật ở production: tin biên lai do client tự khai.
    dev-store:
      enabled: ${BILLING_DEV_STORE:false}
    # Tất cả để trống = tích hợp Apple/Google TẮT (fail closed). Xem services/billing-service/STORES.md.
    apple:
      bundle-id: ${APPLE_BUNDLE_ID:}
      issuer-id: ${APPLE_ISSUER_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key-file: ${APPLE_PRIVATE_KEY_FILE:}          # file .p8 (PKCS#8)
      root-cert-files: ${APPLE_ROOT_CERT_FILES:}            # Apple Root CA G3, nhiều file ngăn cách bằng dấu phẩy
      environment: ${APPLE_ENVIRONMENT:PRODUCTION}          # PRODUCTION | SANDBOX
      allow-sandbox-fallback: ${APPLE_ALLOW_SANDBOX_FALLBACK:false}  # chỉ bật khi App Review/TestFlight
      require-apple-oid: ${APPLE_REQUIRE_OID:true}
    google:
      package-name: ${GOOGLE_PACKAGE_NAME:}
      service-account-file: ${GOOGLE_SERVICE_ACCOUNT_FILE:}  # JSON của service account có quyền Play Developer API
      push-audience: ${GOOGLE_PUSH_AUDIENCE:}               # audience của Pub/Sub push subscription
      push-service-account: ${GOOGLE_PUSH_SERVICE_ACCOUNT:} # email service account ký OIDC token của push
      server-acknowledge: ${GOOGLE_SERVER_ACKNOWLEDGE:false}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
    instances:
      # KHÔNG dùng `{}`: qua Config Server (JSON) map rỗng thành LinkedHashMap và bind lỗi -> service không khởi động.
      store-apple:
        base-config: default
      store-google:
        base-config: default
  retry:
    instances:
      store-apple:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
      store-google:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
