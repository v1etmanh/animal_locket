<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="style">
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
               font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #f5f3ff; color: #1f1b2e; }
        .card { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 28px 24px;
                box-shadow: 0 10px 30px rgba(91, 33, 182, .12); }
        .brand { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6d28d9; }
        h1 { margin: 0 0 16px; font-size: 24px; line-height: 1.25; }
        h1.ok { color: #047857; } h1.warn { color: #b45309; } h1.bad { color: #b91c1c; }
        .order { margin: 0 0 20px; padding: 14px 16px; background: #faf5ff; border-radius: 12px; }
        .order dt { font-size: 12px; color: #6b7280; margin-top: 8px; }
        .order dt:first-child { margin-top: 0; }
        .order dd { margin: 2px 0 0; font-weight: 600; }
        .order .price { font-size: 20px; }
        .notice { margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; background: #fffbeb; color: #92400e; font-size: 14px; }
        .primary { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; cursor: pointer;
                   padding: 14px 16px; border-radius: 12px; font: inherit; font-weight: 700; color: #fff; background: #6d28d9; }
        .primary:hover { background: #5b21b6; }
        form + form { margin-top: 10px; }
        .primary.vietqr { background: #0e7490; } .primary.vietqr:hover { background: #155e75; }
        .fine { margin: 16px 0 0; font-size: 12px; line-height: 1.5; color: #6b7280; }
    </style>
</head>
<body></body>
</html>
