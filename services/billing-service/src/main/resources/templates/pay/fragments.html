<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!--
      Giao diện theo phong cách app (mobile/lib/core/theme): bảng màu app_colors.dart, phông Fraunces + Plus Jakarta Sans,
      bo góc 18/28, nút gradient cam/xanh như GradientButton. CSP của /pay/** chặn script và phông ngoài, nên: không có JS,
      phông phục vụ từ /pay/assets/fonts (font-src 'self'), minh hoạ là SVG nội dòng.
    -->
    <style th:fragment="style">
        @font-face { font-family: "Plus Jakarta Sans"; src: url("/pay/assets/fonts/PlusJakartaSans.ttf") format("truetype");
                     font-weight: 200 800; font-style: normal; font-display: swap; }
        @font-face { font-family: "Fraunces"; src: url("/pay/assets/fonts/Fraunces.ttf") format("truetype");
                     font-weight: 100 900; font-style: normal; font-display: swap; }

        :root { color-scheme: light; --ink: #1e1b2e; --muted: #5f5878; --purple: #7c4dda; --purple-ink: #6b3fc4; --soft: #f7f4fc;
                --orange-light: #ffb877; --orange: #ff8f45; --orange-ink: #2b1400; --green: #0d8466; --green-dark: #0a6b55; }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink);
               font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: linear-gradient(180deg, #fff 0%, #fbfafd 60%, #f4f1f9 100%) fixed; }
        .stage { width: 100%; max-width: 420px; margin: 0 auto; padding: 20px 0 32px; }
        .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 4px;
                 font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 20px; letter-spacing: .2px; }

        /* Cảnh thỏ mang cà rốt tới mèo: tâm trạng đổi bằng lớp mood-* trên <svg>. */
        .scene { display: block; width: 100%; height: auto; }
        .scene .only-ground, .scene .only-hearts, .scene .only-sweat, .scene .eyes-happy, .scene .brows, .scene .blush { display: none; }
        .scene .rabbit { transform: translate(70px, 300px); }
        .mood-wait .rabbit { transform: translate(150px, 300px); }
        .mood-done .rabbit { transform: translate(188px, 300px); }
        .mood-oops .rabbit { transform: translate(100px, 300px); }
        .mood-done .only-motion, .mood-oops .only-motion, .mood-oops .only-paw, .mood-done .eyes-open { display: none; }
        .mood-oops .only-ground, .mood-oops .only-sweat, .mood-oops .brows,
        .mood-done .only-hearts, .mood-done .eyes-happy, .mood-done .blush { display: inline; }
        @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes dot-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }
        .mood-run .hop, .mood-wait .hop { animation: hop .6s ease-in-out infinite; }
        .mood-done .only-hearts { animation: float 2.4s ease-in-out infinite; }

        .card { position: relative; margin: -11.3% 16px 0; padding: 22px 20px 20px; border-radius: 28px;
                background: rgba(255, 255, 255, .94); border: 1px solid rgba(255, 255, 255, .9);
                box-shadow: 0 10px 26px rgba(30, 27, 46, .12);
                -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
                display: flex; flex-direction: column; gap: 16px; }
        .head { display: flex; align-items: center; gap: 14px; }
        h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 26px; line-height: 1.15; }
        .badge { width: 48px; height: 48px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .badge.ok { background: linear-gradient(135deg, #2fc49c, var(--green)); }
        .badge.warn { background: #fff1e0; }
        .badge.bad { background: #fdecee; }
        p { margin: 0; }
        .text { font-size: 14.5px; line-height: 1.55; }

        .summary { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: var(--soft); }
        .summary .tile { width: 48px; height: 48px; flex: none; border-radius: 16px; display: flex; align-items: center; justify-content: center;
                         background: linear-gradient(135deg, var(--orange-light), var(--orange)); }
        .summary .name { font-size: 16px; font-weight: 700; }

        .order { margin: 0; padding: 12px 14px; border-radius: 18px; background: var(--soft); display: flex; flex-direction: column; gap: 10px; }
        .order div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
        .order dt { font-size: 13.5px; color: var(--muted); }
        .order dd { margin: 0; font-size: 14px; font-weight: 700; text-align: right; }
        .order dd.price { font-size: 18px; font-weight: 800; }

        .methods { display: flex; flex-direction: column; gap: 10px; }
        .methods h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
        .methods form { margin: 0; }
        .notice { padding: 10px 12px; border-radius: 12px; background: #fffbeb; color: #7a3d0a; font-size: 14px; line-height: 1.45; }

        .btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px;
               border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; text-align: left; text-decoration: none;
               cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn.method { min-height: 64px; }
        .btn .label { display: flex; flex-direction: column; gap: 1px; flex: 1; }
        .btn .sub { font-size: 13px; font-weight: 600; }
        .btn.solo { text-align: center; }
        .btn:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }
        .btn:active { transform: translateY(1px); }
        .btn-orange { color: var(--orange-ink); background: linear-gradient(90deg, var(--orange-light), var(--orange));
                      box-shadow: 0 8px 18px rgba(255, 143, 69, .35); }
        .btn-green { color: #fff; background: linear-gradient(90deg, var(--green), var(--green-dark));
                     box-shadow: 0 8px 18px rgba(13, 132, 102, .32); }
        .btn-outline { color: var(--purple-ink); background: #fff; border: 1.5px solid var(--purple); }
        .btn-link { min-height: 48px; color: var(--purple-ink); background: transparent; font-size: 15px; }
        .actions { display: flex; flex-direction: column; gap: 10px; }

        .dots { display: flex; align-items: center; justify-content: center; gap: 8px; height: 20px; }
        .dots span { width: 8px; height: 8px; border-radius: 4px; background: var(--purple); animation: dot-bounce 1.2s infinite ease-in-out; }
        .dots span:nth-child(2) { animation-delay: .15s; }
        .dots span:nth-child(3) { animation-delay: .3s; }

        .fine { font-size: 12px; line-height: 1.5; color: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            .mood-run .hop, .mood-wait .hop, .mood-done .only-hearts, .dots span { animation: none; }
            .btn:active { transform: none; }
        }
    </style>
</head>
<body>

<!-- Logo + tên app ở đầu trang. -->
<p class="brand" th:fragment="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke="#7c4dda" stroke-width="2"/><path d="M12 16.5 C7.5 13 9 9.2 12 11.2 C15 9.2 16.5 13 12 16.5 Z" fill="#ff8f45"/></svg>
    Animal Locket
</p>

<!--
  Cảnh nền. mood: run (thỏ đang chạy), wait (gần tới), done (đã trao cà rốt), oops (cà rốt rơi).
  Trang trí thuần tuý nên aria-hidden.
-->
<svg th:fragment="scene(mood)" class="scene" th:classappend="'mood-' + ${mood}" viewBox="0 0 390 360" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <circle cx="316" cy="58" r="34" fill="#ffe3c7"/>
    <g fill="#fff" opacity=".95"><rect x="18" y="64" width="96" height="26" rx="13"/><rect x="40" y="46" width="56" height="28" rx="14"/></g>
    <g fill="#fff" opacity=".85"><rect x="214" y="116" width="78" height="22" rx="11"/><rect x="232" y="100" width="42" height="24" rx="12"/></g>
    <path d="M0 232 C54 186 128 196 196 226 C262 254 330 204 390 222 L390 360 L0 360 Z" fill="#e6ddf5"/>
    <path d="M0 268 C80 236 160 252 230 266 C300 280 350 246 390 256 L390 360 L0 360 Z" fill="#d8cbf2"/>
    <path d="M0 290 C100 278 290 278 390 290 L390 360 L0 360 Z" fill="#cff1e3"/>
    <g stroke="#8fd6ba" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M26 304 l-3 -9 M26 304 l1 -11 M26 304 l5 -8"/>
        <path d="M116 308 l-3 -8 M116 308 l2 -10 M116 308 l5 -7"/>
        <path d="M246 310 l-3 -8 M246 310 l2 -10 M246 310 l5 -7"/>
    </g>

    <!-- thỏ -->
    <g class="rabbit" transform="translate(70 300)">
        <ellipse cx="-4" cy="6" rx="52" ry="6" fill="#1e1b2e" opacity=".1"/>
        <g class="hop">
            <g class="only-motion" stroke="#b79cf0" stroke-width="3.5" stroke-linecap="round" fill="none">
                <path d="M-68 -64 h-26"/><path d="M-74 -46 h-34"/><path d="M-68 -28 h-22"/>
            </g>
            <path d="M-8 -22 L-30 -2" stroke="#1e1b2e" stroke-width="12" stroke-linecap="round"/>
            <path d="M-8 -22 L-30 -2" stroke="#f3eefb" stroke-width="6" stroke-linecap="round"/>
            <path d="M18 -24 L42 -6" stroke="#1e1b2e" stroke-width="12" stroke-linecap="round"/>
            <path d="M18 -24 L42 -6" stroke="#f3eefb" stroke-width="6" stroke-linecap="round"/>
            <circle cx="-40" cy="-46" r="9" fill="#fff" stroke="#1e1b2e" stroke-width="3"/>
            <path d="M-22 -30 L-54 -10" stroke="#1e1b2e" stroke-width="13" stroke-linecap="round"/>
            <path d="M-22 -30 L-54 -10" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
            <ellipse cx="-4" cy="-42" rx="34" ry="22" fill="#fff" stroke="#1e1b2e" stroke-width="3" transform="rotate(-8 -4 -42)"/>
            <g transform="rotate(-38 30 -76)">
                <ellipse cx="30" cy="-96" rx="6.5" ry="20" fill="#f3eefb" stroke="#1e1b2e" stroke-width="3"/>
                <ellipse cx="30" cy="-96" rx="2.8" ry="13" fill="#ffc7d9"/>
            </g>
            <g transform="rotate(-20 40 -76)">
                <ellipse cx="40" cy="-96" rx="6.5" ry="20" fill="#fff" stroke="#1e1b2e" stroke-width="3"/>
                <ellipse cx="40" cy="-96" rx="2.8" ry="13" fill="#ffc7d9"/>
            </g>
            <circle cx="36" cy="-58" r="17" fill="#fff" stroke="#1e1b2e" stroke-width="3"/>
            <circle cx="42" cy="-61" r="2.8" fill="#1e1b2e"/>
            <circle cx="43" cy="-62" r=".9" fill="#fff"/>
            <circle cx="52" cy="-56" r="2.6" fill="#ff7fa3"/>
            <path d="M49 -52 q2 3 5 1" stroke="#1e1b2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <circle cx="40" cy="-51" r="4" fill="#ffb3c8" opacity=".7"/>
            <path class="only-sweat" transform="translate(64 -86)" d="M0 -8 C6 0 6 6 0 8 C-6 6 -6 0 0 -8 Z" fill="#9addf5" stroke="#1e1b2e" stroke-width="2"/>
            <path d="M18 -34 L54 -38" stroke="#1e1b2e" stroke-width="13" stroke-linecap="round"/>
            <path d="M18 -34 L54 -38" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
            <g class="only-paw" transform="translate(54 -38)">
                <ellipse cx="-8" cy="-13" rx="4.5" ry="10" fill="#2fc49c" stroke="#1e1b2e" stroke-width="2" transform="rotate(-28 -8 -13)"/>
                <ellipse cx="1" cy="-15" rx="4.5" ry="11" fill="#2fc49c" stroke="#1e1b2e" stroke-width="2" transform="rotate(10 1 -15)"/>
                <path d="M-2 -7 L44 -1.5 Q49 0 44 2.5 L-2 8 Q-6 0 -2 -7 Z" fill="#ff8f45" stroke="#1e1b2e" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M12 -3.5 l3 4 M24 -2 l-2 5 M34 -1 l2 3" stroke="#ffb877" stroke-width="2" stroke-linecap="round" fill="none"/>
                <circle cx="4" cy="0" r="6.5" fill="#fff" stroke="#1e1b2e" stroke-width="2.5"/>
            </g>
        </g>
        <g class="only-ground">
            <g transform="translate(70 -4) rotate(-4)">
                <ellipse cx="-8" cy="-3" rx="9" ry="4" fill="#2fc49c" stroke="#1e1b2e" stroke-width="2"/>
                <path d="M-2 -7 L26 -2 Q30 0 26 2 L-2 8 Q-6 0 -2 -7 Z" fill="#ff8f45" stroke="#1e1b2e" stroke-width="2.5" stroke-linejoin="round"/>
            </g>
            <g transform="translate(106 -2) rotate(12)">
                <path d="M0 -3 L16 -.5 Q19 0 16 1.5 L0 5 Z" fill="#ff8f45" stroke="#1e1b2e" stroke-width="2.5" stroke-linejoin="round"/>
            </g>
        </g>
    </g>

    <!-- mèo -->
    <g transform="translate(322 300)">
        <ellipse cx="4" cy="6" rx="38" ry="6" fill="#1e1b2e" opacity=".1"/>
        <path d="M22 -8 C52 -6 56 -46 40 -62" stroke="#1e1b2e" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M22 -8 C52 -6 56 -46 40 -62" stroke="#ffb877" stroke-width="7" stroke-linecap="round" fill="none"/>
        <ellipse cx="0" cy="-32" rx="26" ry="32" fill="#ffb877" stroke="#1e1b2e" stroke-width="3"/>
        <ellipse cx="-6" cy="-24" rx="13" ry="20" fill="#fff1e0"/>
        <path d="M18 -48 l-9 3 M20 -36 l-10 2" stroke="#e57a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="-14" cy="-3" rx="10" ry="6" fill="#fff1e0" stroke="#1e1b2e" stroke-width="2.5"/>
        <ellipse cx="6" cy="-3" rx="10" ry="6" fill="#fff1e0" stroke="#1e1b2e" stroke-width="2.5"/>
        <polygon points="-26,-84 -24,-112 -6,-92" fill="#ffb877" stroke="#1e1b2e" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="-23,-88 -22,-104 -12,-92" fill="#ffc7d9"/>
        <polygon points="10,-92 26,-112 28,-82" fill="#ffb877" stroke="#1e1b2e" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="14,-92 24,-104 24,-87" fill="#ffc7d9"/>
        <ellipse cx="-4" cy="-74" rx="25" ry="21" fill="#ffb877" stroke="#1e1b2e" stroke-width="3"/>
        <path d="M-4 -94 v8 M-12 -93 l1 7 M4 -93 l-1 7" stroke="#e57a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
        <g class="eyes-open">
            <ellipse cx="-14" cy="-76" rx="4" ry="5" fill="#1e1b2e"/><ellipse cx="6" cy="-76" rx="4" ry="5" fill="#1e1b2e"/>
            <circle cx="-15" cy="-78" r="1.4" fill="#fff"/><circle cx="5" cy="-78" r="1.4" fill="#fff"/>
        </g>
        <g class="eyes-happy" stroke="#1e1b2e" stroke-width="2.6" stroke-linecap="round" fill="none">
            <path d="M-19 -75 q5 -7 10 0"/><path d="M1 -75 q5 -7 10 0"/>
        </g>
        <g class="brows" stroke="#1e1b2e" stroke-width="2.4" stroke-linecap="round" fill="none">
            <path d="M-19 -82 L-9 -87"/><path d="M1 -87 L11 -82"/>
        </g>
        <g class="blush" fill="#ff9db8" opacity=".7"><circle cx="-21" cy="-66" r="4"/><circle cx="13" cy="-66" r="4"/></g>
        <path d="M-6 -69 l4 0 l-2 3 z" fill="#ff7fa3"/>
        <path d="M-4 -66 q-3 4 -7 1 M-4 -66 q3 4 7 1" stroke="#1e1b2e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <g stroke="#1e1b2e" stroke-width="1.4" stroke-linecap="round" opacity=".6">
            <path d="M-24 -68 l-14 -3"/><path d="M-24 -64 l-14 3"/><path d="M20 -68 l14 -3"/><path d="M20 -64 l14 3"/>
        </g>
    </g>

    <g class="only-hearts">
        <path transform="translate(266 168) scale(1.5)" d="M0 4 C-8 -4 -4 -12 0 -7 C4 -12 8 -4 0 4 Z" fill="#ff7fa3"/>
        <path transform="translate(294 138) scale(1.1)" d="M0 4 C-8 -4 -4 -12 0 -7 C4 -12 8 -4 0 4 Z" fill="#b79cf0"/>
        <path transform="translate(246 130) scale(.9)" d="M0 4 C-8 -4 -4 -12 0 -7 C4 -12 8 -4 0 4 Z" fill="#ff8f45"/>
    </g>
</svg>
</body>
</html>
