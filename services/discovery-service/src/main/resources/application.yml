server:
  port: 8104

spring:
  application:
    name: discovery-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config-dev-password}
      fail-fast: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/animal-locket/protocol/openid-connect/certs}

animal:
  security:
    enabled: true
  discovery:
    # Khoá bí mật tạo độ lệch vị trí cố định theo từng người. PHẢI đặt giá trị riêng và giữ kín ở production.
    secret: ${DISCOVERY_SECRET:dev-only-secret-change-me-in-prod}
    location-ttl: 30m
    radius-adult-m: 10000
    radius-minor-m: 5000
    cards-per-minute: 10
  limits:
    swipes-per-day:
      free: 30
      pro: 150

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
    instances:
      # Quẹt phải gọi user-service tạo lời mời: ~8 truy vấn nối tiếp, với DB cloud mất 3–4 giây (đo 3,5 s).
      # 2 giây làm quẹt báo USER_SERVICE_UNAVAILABLE dù lời mời đã được tạo. Gọi lại an toàn (ALREADY_REQUESTED).
      user-service:
        timeout-duration: 6s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
