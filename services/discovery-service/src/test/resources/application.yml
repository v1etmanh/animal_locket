spring:
  application:
    name: discovery-service
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/unused

eureka:
  client:
    enabled: false

animal:
  kv:
    type: memory
  security:
    enabled: true
  discovery:
    secret: test-secret-for-unit-tests-0123456789
    cards-per-minute: 1000
  limits:
    swipes-per-day:
      free: 3
      pro: 6
