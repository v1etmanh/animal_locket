spring:
  application:
    name: media-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:mediadb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/unused

eureka:
  client:
    enabled: false

storage:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket: test

animal:
  security:
    enabled: true
  outbox:
    relay:
      enabled: false
  media:
    janitor:
      enabled: false
    max-bytes: 1000000
    max-uploads-per-hour: 5
