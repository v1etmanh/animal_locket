server:
  port: 8101

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config-dev-password}
      fail-fast: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${DB_USER:animal}
    password: ${DB_PASSWORD:animal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}   # đổi sang validate sau khi đã kiểm tra với MySQL thật (xem docs/14)
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/animal-locket/protocol/openid-connect/certs}

keycloak:
  admin:
    url: ${KEYCLOAK_ADMIN_URL:}
    realm: animal-locket
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

animal:
  security:
    enabled: true
  limits:
    invites-per-day:
      free: 20
      pro: 80
    spin-interval:
      free: 7d
      pro: 1d
  # CHỈ DÙNG KHI DEV: publicId của một tài khoản đã đăng ký; tài khoản này tự thành bạn của mọi người
  # (khi đăng ký mới và khi service khởi động) để test chat. Để trống = tắt.
  dev-buddy:
    public-id: ${DEV_BUDDY_PUBLIC_ID:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
